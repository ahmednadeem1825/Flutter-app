name: secure_view
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  logger: ^2.6.2
  cupertino_icons: ^1.0.8
  smooth_page_indicator: ^1.0.0
  animated_splash_screen: ^1.3.0
  flutter_native_splash: ^2.4.6
  lottie: ^3.3.2
  webview_flutter: ^4.13.0
  supabase_flutter: ^2.10.2
  flutter_svg: ^2.2.1
  google_sign_in: ^5.4.2
  flutter_riverpod: ^3.0.3
  google_fonts: ^6.3.2
  fl_chart: ^1.1.1
  provider: ^6.1.5+1
  flutter_dotenv: ^6.0.0
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icon/icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/icon/icon.png"
# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/logo.png
    - assets/images/splashscreen.gif
    - assets/images/screen2icon.png
    - assets/images/icon/icon.png
    - assets/images/screen1.png
    - assets/images/screen3.png
    - assets/images/SVGs/google.svg
    - .env

  
